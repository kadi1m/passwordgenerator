name: Deploy with Rollback and Discord Alert

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      USER: kadin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Production with Rollback
        run: |
          ssh -o StrictHostKeyChecking=no $USER@24.40.99.53 "
            set -e
            mkdir -p ~/docker/passwordgenerator
            cd ~/docker/passwordgenerator

            if [ ! -d .git ]; then
              echo '📁 Not a Git repo. Cleaning and cloning...'
              sudo chown -R $USER:$USER .
              find . -mindepth 1 -maxdepth 1 ! -name '.gitignore' -exec rm -rf {} +
              sudo rm -f /home/kadin/.gitconfig.lock
              sudo chown $USER:$USER /home/kadin/.gitconfig || true
              git clone https://${GH_PAT}@github.com/kadi1m/passwordgenerator.git .
            else
              echo '🔄 Git repo exists. Pulling latest changes...'
              echo "User: $(whoami)"
              sudo chown kadin:kadin /home/kadin
              sudo chmod 755 /home/kadin
              sudo chown -R kadin:kadin /home/kadin/docker/passwordgenerator
              sudo rm -rf /home/kadin/.gitconfig.lock
              sudo rm -rf /home/kadin/.gitconfig
              git config --global --add safe.directory /home/kadin/docker/passwordgenerator
              git remote set-url origin https://${GH_PAT}@github.com/kadi1m/passwordgenerator.git 
              git fetch origin
              git reset --hard origin/main
            fi

            echo '🧹 Cleaning up existing containers...'
            docker rm -f passwordgenerator-passgen || true

            echo '🔧 Rebuilding Docker...'
            docker compose down
            docker compose build --no-cache
            docker compose up -d
          "

      - name: ✅ Notify Success to Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST "$DISCORD_WEBHOOK" \
          -d "$(jq -n --arg user "${{ github.actor }}" '{
            "embeds": [{
              "title": "✅ Deployment Successful",
              "description": ("Deployed by **" + $user + "** to production."),
              "color": 5763719
            }]
          }')"

      - name: ❌ Notify Failure to Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST "$DISCORD_WEBHOOK" \
          -d "$(jq -n --arg user "${{ github.actor }}" '{
            "embeds": [{
              "title": "❌ Deployment Failed",
              "description": ("Attempted by **" + $user + "**."),
              "color": 15548997
            }]
          }')"
